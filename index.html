<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Versão Final</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #000000 50%, #c8102e 50%);
      padding: 1.5rem 1rem;
    }

    .cartao {
      padding: 2.5rem 2rem;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
      text-align: center;
      color: #1d1d1f;
      border: 3px solid #c8102e;
      background-color: #ffffff;
      border-radius: 12px;
    }

    .escudo-container {
      margin-bottom: 1rem;
    }

    .escudo {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s ease;
    }

    .escudo:hover {
      transform: scale(1.08);
    }

    .emoji {
      font-size: 2.5rem;
      margin: 0.5rem 0;
    }

    h1 { 
      margin: .5rem 0; 
      color: #c8102e; 
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitulo {
      color: #555;
      font-size: 1.05rem;
      margin-bottom: 1.8rem;
    }

    .tabela-container {
      overflow-x: auto;
      margin-top: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background-color: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th {
      background-color: #c8102e;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      font-size: 0.95rem;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .quantidade {
      font-weight: bold;
      color: #c8102e;
    }

    .versao {
      margin-top: 2rem;
      padding: 0.75rem;
      background-color: #111;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .versao p {
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="escudo-container">
      <img 
        class="escudo" 
        src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_brazilian_matching.svg" 
        alt="Escudo do Clube de Regatas do Flamengo"
      >
    </div>

    <div class="emoji">🏁</div>
    <h1>Versão Final</h1>
    <p class="subtitulo">Principais Títulos do Clube de Regatas do Flamengo</p>

    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Competição</th>
            <th>Qtd</th>
            <th>Anos das Conquistas</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Copa Intercontinental / Mundial</strong></td>
            <td class="quantidade">1</td>
            <td>1981</td>
          </tr>
          <tr>
            <td><strong>Copa Libertadores da América</strong></td>
            <td class="quantidade">4</td>
            <td>1981, 2019, 2022, 2025</td>
          </tr>
          <tr>
            <td><strong>Campeonato Brasileiro
